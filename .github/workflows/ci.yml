name: CI

on:
  push:
    branches: [ "**" ]
    # with only a branch filter a pushed tag would not start a run, and no release would be made
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    # Nightly at 02:00 UTC
    - cron: "0 2 * * *"

jobs:
  build-test-and-package:
    name: ${{ matrix.os }} - Build & Test${{ github.event_name == 'schedule' && ' + Package' || '' }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cpack_generator: TGZ
          - os: macos-latest
            cpack_generator: ZIP
          - os: windows-latest
            cpack_generator: ZIP

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- OS-specific prerequisites ---
      - name: Install prerequisites (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          # build-essential for C/C++, ninja optional
          sudo apt-get install -y build-essential ninja-build

      - name: Install prerequisites (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          # macOS runners include CMake; if your project needs extras, add brew installs here.
          cmake --version

      # Windows: use latest MSVC toolset with Ninja (no dialect flags here)
      - name: Enable MSVC dev environment
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Windows + Ninja + MSVC)
        if: startsWith(matrix.os, 'windows')
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Configure (*nix)
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests (CTest)
        run: ctest --test-dir build --output-on-failure --no-tests=error

      # Package only on nightly or tag builds
      - name: Package (CPack)
        if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
        run: >
          cpack -C Release
          -G "${{ matrix.cpack_generator }}"
          --config build/CPackConfig.cmake
          -B build

      - name: Upload package artifact
        if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: chiplet-${{ matrix.os }}-artifacts
          path: |
            build/*.zip
            build/*.tar.gz
          if-no-files-found: warn
  create-release:
    name: Create GitHub Release
    needs: [build-test-and-package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts from matrix
        uses: actions/download-artifact@v4
        with:
          pattern: chiplet-*-artifacts
          merge-multiple: true

      - name: Create release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: chiplet ${{ github.ref_name }}
          artifacts: "**/*.zip, **/*.tar.gz"
          artifactErrorsFailBuild: true
          allowUpdates: true
          # Keep title and notes of a release that was created in the GitHub UI
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          generateReleaseNotes: true
